<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1580 740">
  <title id="title">Ticket Booking / Flash Sale high-level architecture</title>
  <desc id="desc">A virtual waiting room meters requests into atomic inventory reservations. Successful reservations become orders and payments while sold-out customers are requeued.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <style>
      .title { font: 700 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-label { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172554; }
      .edge-label { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .group-label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .legend { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748B; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <rect x="28" y="24" width="8" height="50" rx="4" fill="#4F46E5"/>
  <text x="54" y="47" class="title">Ticket Booking / Flash Sale</text>
  <text x="54" y="70" class="subtitle">High-level architecture · Admission control protects a strongly consistent inventory reservation</text>
  <text x="1544" y="48" text-anchor="end" class="legend">Blue: service path  ·  Orange: event stream  ·  Green: durable data  ·  Purple: control plane</text>
  
  <path d="M 145 320 L 145 139 L 280 139 L 280 139" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="157" y="113" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="213" y="128" text-anchor="middle" class="edge-label">Browse</text></g>
  <path d="M 240 359 L 280 359" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 470 359 L 560 359" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="459" y="342" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="515" y="357" text-anchor="middle" class="edge-label">Admit</text></g>
  <path d="M 750 359 L 850 359" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1040 359 L 1045 359 L 1045 229 L 1140 229" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="1036" y="272" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1092" y="287" text-anchor="middle" class="edge-label">Reserved</text></g>
  <path d="M 1235 268 L 1235 470" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1330 509 L 1380 509" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1040 359 L 1045 139 L 1380 139 L 1380 119" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="1154" y="113" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1210" y="128" text-anchor="middle" class="edge-label">Sold out</text></g>
  
    <g>
      <rect x="50" y="320" width="190" height="78" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="145" text-anchor="middle" class="node-label"><tspan x="145" y="364">Visitor</tspan></text>
    </g>
  
    <g>
      <rect x="280" y="100" width="190" height="78" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
      <text x="375" text-anchor="middle" class="node-label"><tspan x="375" y="134.5">CDN</tspan><tspan x="375" y="153.5">Static sale page</tspan></text>
    </g>
  
    <g>
      <rect x="280" y="320" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="375" text-anchor="middle" class="node-label"><tspan x="375" y="354.5">Virtual waiting room</tspan><tspan x="375" y="373.5">Token + heartbeat</tspan></text>
    </g>
  
    <g>
      <rect x="560" y="320" width="190" height="78" rx="16" fill="#FDF4FF" stroke="#C026D3" stroke-width="2"/>
      <text x="655" text-anchor="middle" class="node-label"><tspan x="655" y="354.5">Controlled admission</tspan><tspan x="655" y="373.5">Metered batches</tspan></text>
    </g>
  
    <g>
      <rect x="850" y="320" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="945" text-anchor="middle" class="node-label"><tspan x="945" y="354.5">Atomic inventory</tspan><tspan x="945" y="373.5">Reserve remaining tickets</tspan></text>
    </g>
  
    <g>
      <rect x="1140" y="190" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="1235" text-anchor="middle" class="node-label"><tspan x="1235" y="224.5">Order service</tspan><tspan x="1235" y="243.5">15-minute payment window</tspan></text>
    </g>
  
    <g>
      <rect x="1140" y="470" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="1235" text-anchor="middle" class="node-label"><tspan x="1235" y="514">Payment</tspan></text>
    </g>
  
    <g>
      <rect x="1380" y="470" width="190" height="78" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
      <text x="1475" text-anchor="middle" class="node-label"><tspan x="1475" y="514">Ticket issuance</tspan></text>
    </g>
  
    <g>
      <rect x="1380" y="80" width="190" height="78" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/>
      <text x="1475" text-anchor="middle" class="node-label"><tspan x="1475" y="124">Waitlist / requeue</tspan></text>
    </g>
</svg>