<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1540 760">
  <title id="title">News Feed high-level architecture</title>
  <desc id="desc">Posts enter a store, create fanout events and fill follower timelines. Feed reads use the timeline cache first and use a pull merge path on misses.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <style>
      .title { font: 700 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-label { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172554; }
      .edge-label { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .group-label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .legend { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748B; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <rect x="28" y="24" width="8" height="50" rx="4" fill="#4F46E5"/>
  <text x="54" y="47" class="title">News Feed</text>
  <text x="54" y="70" class="subtitle">High-level architecture · Hybrid fanout-on-write and pull-on-read feed assembly</text>
  <text x="1504" y="48" text-anchor="end" class="legend">Blue: service path  ·  Orange: event stream  ·  Green: durable data  ·  Purple: control plane</text>
  
  <path d="M 240 189 L 290 189" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 480 189 L 530 189" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 720 189 L 770 189" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 960 189 L 1030 189" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1125 228 L 1125 260 L 1385 260 L 1385 290" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="1199" y="234" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1255" y="249" text-anchor="middle" class="edge-label">Fanout</text></g>
  <path d="M 865 350 L 1125 228" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="809" y="282" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="865" y="297" text-anchor="middle" class="edge-label">Followers</text></g>
  <path d="M 240 579 L 290 579" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 480 579 L 530 579" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="429" y="562" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="485" y="577" text-anchor="middle" class="edge-label">Miss</text></g>
  <path d="M 480 579 L 385 680 L 1385 680 L 1385 368" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="829" y="654" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="885" y="669" text-anchor="middle" class="edge-label">Timeline read</text></g>
  <path d="M 625 540 L 625 470 L 625 268 L 625 228" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><g><rect x="624" y="352" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="680" y="367" text-anchor="middle" class="edge-label">Source posts</text></g>
  <path d="M 625 540 L 625 455 L 865 455 L 865 428" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><g><rect x="689" y="429" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="745" y="444" text-anchor="middle" class="edge-label">Follow set</text></g>
  
    <g>
      <rect x="50" y="150" width="190" height="78" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="145" text-anchor="middle" class="node-label"><tspan x="145" y="194">Post creator</tspan></text>
    </g>
  
    <g>
      <rect x="290" y="150" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="385" text-anchor="middle" class="node-label"><tspan x="385" y="194">Post API</tspan></text>
    </g>
  
    <g>
      <rect x="530" y="150" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="625" text-anchor="middle" class="node-label"><tspan x="625" y="194">Post store</tspan></text>
    </g>
  
    <g>
      <rect x="770" y="150" width="190" height="78" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
      <text x="865" text-anchor="middle" class="node-label"><tspan x="865" y="194">Kafka fanout event</tspan></text>
    </g>
  
    <g>
      <rect x="1030" y="150" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="1125" text-anchor="middle" class="node-label"><tspan x="1125" y="194">Fanout worker</tspan></text>
    </g>
  
    <g>
      <rect x="1290" y="290" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="1385" text-anchor="middle" class="node-label"><tspan x="1385" y="324.5">Follower timeline cache</tspan><tspan x="1385" y="343.5">Precomputed feed IDs</tspan></text>
    </g>
  
    <g>
      <rect x="770" y="350" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="865" text-anchor="middle" class="node-label"><tspan x="865" y="394">Follow graph</tspan></text>
    </g>
  
    <g>
      <rect x="50" y="540" width="190" height="78" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="145" text-anchor="middle" class="node-label"><tspan x="145" y="584">Feed reader</tspan></text>
    </g>
  
    <g>
      <rect x="290" y="540" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="385" text-anchor="middle" class="node-label"><tspan x="385" y="584">Feed API</tspan></text>
    </g>
  
    <g>
      <rect x="530" y="540" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="625" text-anchor="middle" class="node-label"><tspan x="625" y="574.5">Pull merge service</tspan><tspan x="625" y="593.5">Cache-miss path</tspan></text>
    </g>
</svg>