<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1660 760">
  <title id="title">Ad Click Aggregator high-level architecture</title>
  <desc id="desc">Click and impression events enter Kafka. A stream processor supplies real-time views while a batch pipeline produces exact audited OLAP data for billing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <style>
      .title { font: 700 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-label { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172554; }
      .edge-label { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .group-label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .legend { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748B; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <rect x="28" y="24" width="8" height="50" rx="4" fill="#4F46E5"/>
  <text x="54" y="47" class="title">Ad Click Aggregator</text>
  <text x="54" y="70" class="subtitle">High-level architecture · Approximate real-time visibility with exact batch billing</text>
  <text x="1624" y="48" text-anchor="end" class="legend">Blue: service path  ·  Orange: event stream  ·  Green: durable data  ·  Purple: control plane</text>
  
  <path d="M 240 329 L 290 329" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 480 329 L 570 329" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 760 329 L 765 329 L 765 159 L 860 159" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="756" y="212" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="812" y="227" text-anchor="middle" class="edge-label">Real-time</text></g>
  <path d="M 1050 159 L 1150 159" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1340 159 L 1245 250 L 1505 250 L 1505 290" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="1319" y="224" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1375" y="239" text-anchor="middle" class="edge-label">Preview</text></g>
  <path d="M 760 329 L 765 329 L 765 509 L 860 509" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="756" y="402" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="812" y="417" text-anchor="middle" class="edge-label">Batch</text></g>
  <path d="M 1050 509 L 1150 509" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1340 509 L 1245 548 L 1505 548 L 1505 368" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="1319" y="522" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1375" y="537" text-anchor="middle" class="edge-label">Historical</text></g>
  <path d="M 1505 368 L 1505 520" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1340 509 L 1245 509 L 1245 159 L 1410 159" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="1236" y="312" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1292" y="327" text-anchor="middle" class="edge-label">Exact</text></g>
  
    <g>
      <rect x="50" y="290" width="190" height="78" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="145" text-anchor="middle" class="node-label"><tspan x="145" y="334">SDK / frontend</tspan></text>
    </g>
  
