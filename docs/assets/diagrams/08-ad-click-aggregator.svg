    </g>
  
    <g>
      <rect x="1150" y="120" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="1245" text-anchor="middle" class="node-label"><tspan x="1245" y="154.5">Real-time store</tspan><tspan x="1245" y="173.5">Redis / OLAP</tspan></text>
    </g>
  
    <g>
