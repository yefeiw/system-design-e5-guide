      <text x="955" text-anchor="middle" class="node-label"><tspan x="955" y="504.5">Batch processor</tspan><tspan x="955" y="523.5">Exact + audit</tspan></text>
    </g>
  
    <g>
      <rect x="1150" y="470" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="1245" text-anchor="middle" class="node-label"><tspan x="1245" y="514">OLAP warehouse</tspan></text>
    </g>
  
    <g>
      <rect x="1410" y="290" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
