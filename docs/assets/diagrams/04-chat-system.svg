      <text x="1105" text-anchor="middle" class="node-label"><tspan x="1105" y="314.5">Kafka</tspan><tspan x="1105" y="333.5">Partition by conversation</tspan></text>
    </g>
  
    <g>
      <rect x="1280" y="100" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="1375" text-anchor="middle" class="node-label"><tspan x="1375" y="134.5">Durable message store</tspan><tspan x="1375" y="153.5">Conversation partition</tspan></text>
    </g>
  
    <g>
      <rect x="1280" y="300" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="1375" text-anchor="middle" class="node-label"><tspan x="1375" y="344">Delivery service</tspan></text>
    </g>
  
    <g>
      <rect x="1010" y="500" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="1105" text-anchor="middle" class="node-label"><tspan x="1105" y="534.5">Routing store</tspan><tspan x="1105" y="553.5">User/device → gateway</tspan></text>
    </g>
  
    <g>
      <rect x="1280" y="500" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="1375" text-anchor="middle" class="node-label"><tspan x="1375" y="544">Target gateway</tspan></text>
    </g>
  
    <g>
      <rect x="1490" y="500" width="190" height="78" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="1585" text-anchor="middle" class="node-label"><tspan x="1585" y="544">Client B</tspan></text>
    </g>
  
    <g>
      <rect x="1490" y="300" width="190" height="78" rx="16" fill="#FDF4FF" stroke="#C026D3" stroke-width="2"/>
      <text x="1585" text-anchor="middle" class="node-label"><tspan x="1585" y="344">APNs / FCM</tspan></text>
