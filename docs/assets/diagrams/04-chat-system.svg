<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1720 760">
  <title id="title">Chat / Messaging high-level architecture</title>
  <desc id="desc">Client A sends through a chat gateway to a message service. Kafka persists messages and drives delivery using a routing store to either a target gateway or push notification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <style>
      .title { font: 700 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-label { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172554; }
      .edge-label { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .group-label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .legend { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748B; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <rect x="28" y="24" width="8" height="50" rx="4" fill="#4F46E5"/>
  <text x="54" y="47" class="title">Chat / Messaging</text>
  <text x="54" y="70" class="subtitle">High-level architecture · Durable, ordered messages with online and offline delivery</text>
  <text x="1684" y="48" text-anchor="end" class="legend">Blue: service path  ·  Orange: event stream  ·  Green: durable data  ·  Purple: control plane</text>
  
  <path d="M 230 319 L 250 319" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 440 319 L 460 319" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 650 319 L 700 319" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 890 319 L 1010 319" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1200 319 L 1185 319 L 1185 139 L 1280 139" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="1176" y="202" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1232" y="217" text-anchor="middle" class="edge-label">Persist</text></g>
  <path d="M 1200 319 L 1185 319 L 1185 339 L 1280 339" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="1176" y="302" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1232" y="317" text-anchor="middle" class="edge-label">Deliver</text></g>
  <path d="M 1375 378 L 1375 440 L 1105 440 L 1105 500" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="1184" y="414" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1240" y="429" text-anchor="middle" class="edge-label">Lookup</text></g>
  <path d="M 1200 539 L 1280 539" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1470 539 L 1490 539" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1470 339 L 1490 339" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1585 378 L 1585 500" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  
    <g>
      <rect x="40" y="280" width="190" height="78" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="135" text-anchor="middle" class="node-label"><tspan x="135" y="324">Client A</tspan></text>
    </g>
  
    <g>
      <rect x="250" y="280" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="345" text-anchor="middle" class="node-label"><tspan x="345" y="324">Load balancer</tspan></text>
    </g>
  
    <g>
      <rect x="460" y="280" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="555" text-anchor="middle" class="node-label"><tspan x="555" y="324">Chat gateway</tspan></text>
    </g>
  
    <g>
      <rect x="700" y="280" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
