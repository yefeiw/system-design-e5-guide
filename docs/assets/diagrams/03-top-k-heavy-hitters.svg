<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1540 720">
  <title id="title">Top-K / Heavy Hitters high-level architecture</title>
  <desc id="desc">Events partition by item ID. Stream aggregators calculate local top K candidates and merge them globally while raw events enter a lake for exact recomputation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <style>
      .title { font: 700 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-label { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172554; }
      .edge-label { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .group-label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .legend { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748B; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <rect x="28" y="24" width="8" height="50" rx="4" fill="#4F46E5"/>
  <text x="54" y="47" class="title">Top-K / Heavy Hitters</text>
  <text x="54" y="70" class="subtitle">High-level architecture · Streaming candidates with an exact batch fallback</text>
  <text x="1504" y="48" text-anchor="end" class="legend">Blue: service path  ·  Orange: event stream  ·  Green: durable data  ·  Purple: control plane</text>
  
  <path d="M 240 309 L 290 309" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 385 270 L 385 159 L 600 159 L 600 159" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="437" y="132" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="493" y="147" text-anchor="middle" class="edge-label">Partitioned stream</text></g>
  <path d="M 790 159 L 910 159" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1100 159 L 1100 159 L 1100 249 L 1210 249" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="1099" y="182" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1155" y="197" text-anchor="middle" class="edge-label">Current Top-K</text></g>
  <path d="M 385 348 L 385 489 L 600 489 L 600 489" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="437" y="462" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="493" y="477" text-anchor="middle" class="edge-label">Raw events</text></g>
  <path d="M 790 489 L 910 489" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 1100 489 L 1105 489 L 1105 288 L 1305 288" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><g><rect x="1099" y="377" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1155" y="392" text-anchor="middle" class="edge-label">Correct / audit</text></g>
  
    <g>
      <rect x="50" y="270" width="190" height="78" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="145" text-anchor="middle" class="node-label"><tspan x="145" y="314">Event sources</tspan></text>
    </g>
  
    <g>
      <rect x="290" y="270" width="190" height="78" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
      <text x="385" text-anchor="middle" class="node-label"><tspan x="385" y="304.5">Kafka</tspan><tspan x="385" y="323.5">Partition by item ID</tspan></text>
    </g>
  
    <g>
      <rect x="600" y="120" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="695" text-anchor="middle" class="node-label"><tspan x="695" y="154.5">Partition aggregators</tspan><tspan x="695" y="173.5">Counts + local Top-K</tspan></text>
    </g>
  
    <g>
      <rect x="910" y="120" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="1005" text-anchor="middle" class="node-label"><tspan x="1005" y="164">Global Top-K merger</tspan></text>
    </g>
  
    <g>
      <rect x="1210" y="210" width="190" height="78" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
      <text x="1305" text-anchor="middle" class="node-label"><tspan x="1305" y="244.5">Query service</tspan><tspan x="1305" y="263.5">+ Redis cache</tspan></text>
    </g>
  
    <g>
      <rect x="600" y="450" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="695" text-anchor="middle" class="node-label"><tspan x="695" y="494">Raw-event data lake</tspan></text>
    </g>
  
    <g>
      <rect x="910" y="450" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="1005" text-anchor="middle" class="node-label"><tspan x="1005" y="484.5">Batch recomputation</tspan><tspan x="1005" y="503.5">Exact + audit</tspan></text>
    </g>
</svg>