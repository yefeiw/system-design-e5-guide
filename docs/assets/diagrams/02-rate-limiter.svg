<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1400 720">
  <title id="title">Rate Limiter high-level architecture</title>
  <desc id="desc">Requests enter an API gateway and are limited in process. Configuration is pushed from a control plane while Redis counters converge in batches.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <style>
      .title { font: 700 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-label { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172554; }
      .edge-label { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .group-label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .legend { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748B; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <rect x="28" y="24" width="8" height="50" rx="4" fill="#4F46E5"/>
  <text x="54" y="47" class="title">Rate Limiter</text>
  <text x="54" y="70" class="subtitle">High-level architecture · Gateway enforcement with distributed counter convergence</text>
  <text x="1364" y="48" text-anchor="end" class="legend">Blue: service path  ·  Orange: event stream  ·  Green: durable data  ·  Purple: control plane</text>
  
  <path d="M 250 299 L 300 299" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 490 299 L 570 299" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 760 299 L 900 299" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="774" y="282" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="830" y="297" text-anchor="middle" class="edge-label">Allowed</text></g>
  <path d="M 665 178 L 665 260" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><g><rect x="609" y="177" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="665" y="192" text-anchor="middle" class="edge-label">Rules</text></g>
  <path d="M 665 338 L 665 450" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="609" y="377" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="665" y="392" text-anchor="middle" class="edge-label">Batched counters</text></g>
  <path d="M 665 338 L 665 420 L 995 420 L 995 450" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="774" y="392" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="830" y="407" text-anchor="middle" class="edge-label">Rejected</text></g>
  <path d="M 665 338 L 830 400 L 1255 400 L 1255 450" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><g><rect x="979" y="374" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="1035" y="389" text-anchor="middle" class="edge-label">Optional event</text></g>
  
    <g>
      <rect x="60" y="260" width="190" height="78" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="155" text-anchor="middle" class="node-label"><tspan x="155" y="304">Client</tspan></text>
    </g>
  
    <g>
      <rect x="300" y="260" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="395" text-anchor="middle" class="node-label"><tspan x="395" y="304">API gateway</tspan></text>
    </g>
  
    <g>
      <rect x="570" y="260" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="665" text-anchor="middle" class="node-label"><tspan x="665" y="294.5">In-process limiter</tspan><tspan x="665" y="313.5">Token bucket / rules</tspan></text>
    </g>
  
    <g>
      <rect x="900" y="260" width="190" height="78" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
      <text x="995" text-anchor="middle" class="node-label"><tspan x="995" y="304">Business service</tspan></text>
    </g>
  
    <g>
      <rect x="570" y="100" width="190" height="78" rx="16" fill="#FDF4FF" stroke="#C026D3" stroke-width="2"/>
      <text x="665" text-anchor="middle" class="node-label"><tspan x="665" y="144">Config center</tspan></text>
    </g>
  
    <g>
      <rect x="570" y="450" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="665" text-anchor="middle" class="node-label"><tspan x="665" y="484.5">Redis counters</tspan><tspan x="665" y="503.5">Cross-instance state</tspan></text>
    </g>
  
    <g>
      <rect x="900" y="450" width="190" height="78" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/>
      <text x="995" text-anchor="middle" class="node-label"><tspan x="995" y="494">429 + Retry-After</tspan></text>
    </g>
  
    <g>
      <rect x="1160" y="450" width="190" height="78" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
      <text x="1255" text-anchor="middle" class="node-label"><tspan x="1255" y="494">Kafka event stream</tspan></text>
    </g>
</svg>