<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1420 720">
  <title id="title">Distributed Message Queue high-level architecture</title>
  <desc id="desc">Producers append to a partition leader. The leader replicates to in-sync replicas. Consumers fetch by offset while a controller manages leadership.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <style>
      .title { font: 700 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-label { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172554; }
      .edge-label { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .group-label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .legend { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748B; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <rect x="28" y="24" width="8" height="50" rx="4" fill="#4F46E5"/>
  <text x="54" y="47" class="title">Distributed Message Queue</text>
  <text x="54" y="70" class="subtitle">High-level architecture · Kafka-style partition leadership, replication, and consumer offsets</text>
  <text x="1384" y="48" text-anchor="end" class="legend">Blue: service path  ·  Orange: event stream  ·  Green: durable data  ·  Purple: control plane</text>
  <rect x="310" y="190" width="880" height="320" rx="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7 6"/><text x="334" y="224" class="group-label">Broker cluster · topic partitions</text>
  <path d="M 250 299 L 430 309" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/>
  <path d="M 620 309 L 760 309" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="634" y="282" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="690" y="297" text-anchor="middle" class="edge-label">Replicate</text></g>
  <path d="M 525 178 L 525 270" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><g><rect x="469" y="217" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="525" y="232" text-anchor="middle" class="edge-label">Elect leader</text></g>
  <path d="M 155 550 L 155 460 L 525 460 L 525 348" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="284" y="434" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="340" y="449" text-anchor="middle" class="edge-label">Fetch by offset</text></g>
  <path d="M 250 589 L 430 589" fill="none" stroke="#64748B" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="284" y="572" width="112" height="22" rx="6" fill="#F8FAFC"/><text x="340" y="587" text-anchor="middle" class="edge-label">Commit</text></g>
  
    <g>
      <rect x="60" y="260" width="190" height="78" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="155" text-anchor="middle" class="node-label"><tspan x="155" y="304">Producers</tspan></text>
    </g>
  
    <g>
      <rect x="430" y="270" width="190" height="78" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="525" text-anchor="middle" class="node-label"><tspan x="525" y="304.5">Partition leader</tspan><tspan x="525" y="323.5">Append-only log</tspan></text>
    </g>
  
    <g>
      <rect x="760" y="270" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="855" text-anchor="middle" class="node-label"><tspan x="855" y="304.5">ISR replicas</tspan><tspan x="855" y="323.5">Synchronous copy</tspan></text>
    </g>
  
    <g>
      <rect x="430" y="100" width="190" height="78" rx="16" fill="#FDF4FF" stroke="#C026D3" stroke-width="2"/>
      <text x="525" text-anchor="middle" class="node-label"><tspan x="525" y="134.5">Controller / Raft</tspan><tspan x="525" y="153.5">Metadata + election</tspan></text>
    </g>
  
    <g>
      <rect x="60" y="550" width="190" height="78" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <text x="155" text-anchor="middle" class="node-label"><tspan x="155" y="594">Consumer group</tspan></text>
    </g>
  
    <g>
      <rect x="430" y="550" width="190" height="78" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="525" text-anchor="middle" class="node-label"><tspan x="525" y="584.5">Internal offset topic</tspan><tspan x="525" y="603.5">__consumer_offsets</tspan></text>
    </g>
</svg>